version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: disaster-response-db
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: disaster-response-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/disaster_response_db
      - JWT_SECRET=super-secret-jwt-key-for-dev-min-32-chars-long!
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
      - LOG_LEVEL=info
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: disaster-response-web
    restart: unless-stopped
    ports:
      - '80:80'
      - '5173:80'
    depends_on:
      - api

volumes:
  mongo_data:
    driver: local
